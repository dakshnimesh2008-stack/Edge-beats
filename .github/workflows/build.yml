name: Build EDGE BEATS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate and extract the project ZIP
        shell: bash
        run: |
          set -euo pipefail
          WORK=.build-work
          rm -rf "$WORK"; mkdir -p "$WORK"

          # Candidate ZIPs = ZIPs that contain a Gradle settings file.
          CANDIDATES=()
          while IFS= read -r -d '' z; do
            if unzip -Z1 "$z" 2>/dev/null | grep -Ev '(^|/)__MACOSX/' | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
              CANDIDATES+=("$z")
            fi
          done < <(find . -type f -iname '*.zip' -not -path './.git/*' -not -path "./$WORK/*" -print0)

          echo "Android project ZIPs found: ${#CANDIDATES[@]}"
          printf '  %s\n' "${CANDIDATES[@]:-}"
          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "::error::No project ZIP (containing settings.gradle[.kts]) found in the repository. Upload EDGE-BEATS.zip to the repository root."
            find . -not -path './.git/*' -maxdepth 2 | head -50
            exit 1
          fi
          if [ "${#CANDIDATES[@]}" -gt 1 ]; then
            echo "::error::Multiple project ZIPs found. Keep exactly one in the repository:"
            printf '::error::  %s\n' "${CANDIDATES[@]}"
            exit 1
          fi

          unzip -q "${CANDIDATES[0]}" -d "$WORK"
          rm -rf "$WORK/__MACOSX"

          mapfile -t SETTINGS < <(find "$WORK" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | sort)
          if [ "${#SETTINGS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Gradle settings file after extraction, found ${#SETTINGS[@]}:"
            printf '::error::  %s\n' "${SETTINGS[@]:-}"
            find "$WORK" -maxdepth 3 | head -60
            exit 1
          fi
          ROOT="$(dirname "${SETTINGS[0]}")"
          [ -f "$ROOT/gradlew" ] || { echo "::error::gradlew not found in $ROOT"; find "$ROOT" -maxdepth 2 | head -40; exit 1; }
          [ -d "$ROOT/app" ] || { echo "::error::app/ module not found in $ROOT"; exit 1; }

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          if [ -f "$ROOT/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "HAS_WRAPPER_JAR=true" >> "$GITHUB_ENV"
          else
            echo "HAS_WRAPPER_JAR=false" >> "$GITHUB_ENV"
            echo "::warning::gradle-wrapper.jar missing from ZIP; falling back to Gradle 8.9 installed on the runner."
          fi
          echo "Project root: $ROOT"
          ls -la "$ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.HAS_WRAPPER_JAR == 'true' && 'wrapper' || '8.9' }}

      - name: Install SDK packages
        shell: bash
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "$HAS_WRAPPER_JAR" = "true" ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Run unit tests
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ "$HAS_WRAPPER_JAR" = "true" ]; then
            ./gradlew --no-daemon testDebugUnitTest
          else
            gradle --no-daemon testDebugUnitTest
          fi

      - name: Verify APK exists
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)"
          [ -n "$APK" ] || { echo "::error::No APK produced"; exit 1; }
          ls -l "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EDGE-BEATS-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ${{ env.PROJECT_ROOT }}/app/build/reports/tests/
          if-no-files-found: ignore
